<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IceCube 3D Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#071525;color:#e6f7ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:14px 16px 8px}h1{margin:0;font-size:22px}p{color:#9ab9ce;font-size:12px;line-height:1.5}.scene{height:58dvh;min-height:310px;position:relative;background:linear-gradient(#061321,#0b3853);overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:12px;bottom:10px;color:#b5d8e9;font-size:12px;pointer-events:none}.status{position:absolute;right:12px;top:12px;color:#5feaff;background:#061321cc;border-radius:6px;padding:6px}.controls{padding:14px 16px 28px}.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;background:#153148;border-radius:9px;padding:10px}.stats strong{display:block;font-size:20px}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}label{font-size:13px}input{width:100%;accent-color:#3cd9ff}button{border:0;border-radius:9px;padding:12px 15px;color:white;background:#23475f;font-weight:600;font-size:14px}button.primary{background:#008cb6}.buttons{display:flex;gap:8px;flex-wrap:wrap}footer{padding-top:14px;color:#a0b5c2;font-size:11px;line-height:1.5}
</style></head><body><header><h1>IceCube 3D Lab</h1><p>南極微中子觀測站 · 互動式教育模擬</p></header><div class="scene"><canvas id="cv"></canvas><div class="status" id="state">SIMULATING</div><div class="hint">單指旋轉 · 雙指縮放 · 拖曳探索</div></div><div class="controls"><div class="stats"><div>DOM 觸發<strong id="hits">0</strong></div><div>時間<strong id="time">0 ns</strong></div><div>DOM 數<strong>480</strong></div></div><div class="sliders"><label>能量 <span id="ev">6</span> / 10<input id="energy" type="range" min="1" max="10" value="6"></label><label>入射角 <span id="av">22</span>°<input id="angle" type="range" min="-65" max="65" value="22"></label></div><div class="buttons"><button class="primary" id="start">▶ 發射微中子</button><button id="pause">暫停</button><button id="reset">重置視角</button></div><footer>示意模型：48 條探測線、480 個 DOM；非 IceCube 官方幾何或 Monte Carlo 物理模擬。碰撞後的光波與 DOM 觸發以簡化模型呈現。</footer></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');if(!ctx){$('state').textContent='Canvas unavailable';return}let yaw=.7,pitch=.3,zoom=1,playing=true,t=0,last=0,energy=6,angle=22;const nodes=[],strings=[];for(let i=0;i<8;i++)for(let j=0;j<6;j++){let x=(i-3.5)*1.25,y=(j-2.5)*1.25;strings.push([x,y]);for(let k=0;k<10;k++)nodes.push([x,y,(k-4.5)*1.1])}
function proj(x,y,z){let a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw),v=z*Math.cos(pitch)-b*Math.sin(pitch),s=Math.min(cv.width,cv.height)/15*zoom;return [cv.width/2+a*s,cv.height/2-v*s,z*Math.sin(pitch)+b*Math.cos(pitch)]}
function line(a,b,color,w=1){let p=proj(...a),q=proj(...b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function draw(){const d=Math.min(devicePixelRatio||1,2),w=Math.max(1,cv.clientWidth),h=Math.max(1,cv.clientHeight);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.clearRect(0,0,cv.width,cv.height);let g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#061321');g.addColorStop(1,'#10425d');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
for(let i=-5;i<=5;i++){line([i,-4,-6],[i,4,-6],'#28506b');line([-5,i*.8,-6],[5,i*.8,-6],'#28506b')}for(const [x,y] of strings)line([x,y,-5.6],[x,y,5.6],'#327994',d);
const th=angle*Math.PI/180,dir=[Math.sin(th),.18,Math.cos(th)],start=dir.map(v=>-6*v),progress=Math.min(1,t/400);if(t>0){const end=start.map((v,i)=>v+12*progress*dir[i]);line(start,end,'#ff7070',2.8*d);let p=proj(...end);ctx.beginPath();ctx.arc(p[0],p[1],4*d,0,Math.PI*2);ctx.fillStyle='#ff8888';ctx.fill()}
if(t>400){let radius=(t-400)/68;for(let k=0;k<3;k++){let r=radius-k*.65;if(r<=0)continue;for(let plane=0;plane<3;plane++){ctx.beginPath();for(let n=0;n<=70;n++){let a=n*Math.PI*2/70,p=plane===0?proj(r*Math.cos(a),r*Math.sin(a),0):plane===1?proj(r*Math.cos(a),0,r*Math.sin(a)):proj(0,r*Math.cos(a),r*Math.sin(a));if(!n)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1])}ctx.strokeStyle='rgba(91,226,255,'+(.33-k*.08)+')';ctx.lineWidth=1.5*d;ctx.stroke()}}}
let hits=0;const sorted=nodes.map(n=>({n,p:proj(...n)})).sort((a,b)=>a.p[2]-b.p[2]);for(const {n,p} of sorted){let r=Math.hypot(...n),active=t>400+r*68&&Math.exp(-r/(1.5+energy*.75))>.08;if(active)hits++;ctx.beginPath();ctx.arc(p[0],p[1],(active?3.8:1.8)*d,0,Math.PI*2);ctx.fillStyle=active?'#ffd063':'#64c9ed';ctx.fill()}$('hits').textContent=hits;$('time').textContent=Math.round(t)+' ns';$('state').textContent=playing?'SIMULATING':'PAUSED'}
function frame(now){if(!document.body.contains(cv))return;if(playing){t+=Math.min(45,now-last||16)*1.4;if(t>1400)t=0}last=now;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('start').onclick=()=>{t=0;playing=true;$('pause').textContent='暫停'};$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'暫停':'繼續'};$('reset').onclick=()=>{yaw=.7;pitch=.3;zoom=1;t=0;playing=true};$('energy').oninput=e=>{energy=+e.target.value;$('ev').textContent=energy};$('angle').oninput=e=>{angle=+e.target.value;$('av').textContent=angle};
let touches=new Map(),dist=0;cv.addEventListener('pointerdown',e=>{touches.set(e.pointerId,[e.clientX,e.clientY]);try{cv.setPointerCapture(e.pointerId)}catch(_){}});cv.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId),dx=e.clientX-old[0],dy=e.clientY-old[1];touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1){yaw+=dx*.009;pitch=Math.max(-1.35,Math.min(1.35,pitch+dy*.006))}else if(touches.size===2){let v=[...touches.values()],newDist=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(dist)zoom=Math.max(.35,Math.min(3,zoom*newDist/dist));dist=newDist}});function up(e){touches.delete(e.pointerId);dist=0}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(3,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
})();
</script></body></html>
